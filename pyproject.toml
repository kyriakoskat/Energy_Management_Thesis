[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-community-thesis"
version = "1.0.0"
description = "Energy management and profit allocation for prosumer coalitions"
requires-python = ">=3.10"
authors = [{name = "Kyriakos Katsiadramis"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<3", "matplotlib>=3.8,<4", "ortools>=9.10,<10"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
energy-community = "energy_community.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

